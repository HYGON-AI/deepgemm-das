# w4a8 masked tune 的运行参数(含 MODE 表 + 扫描 case 引用)
# 由 tune_w4a8.py --config 直接加载, 无中间 index 层
# 本文件内的相对路径(cases / out / config_root)一律相对本 yml 所在目录解析

# =======================================================
# MODE 相关(原 w4a8_modes.yml,已内联到此)
# =======================================================

# 需要遍历的 MODE 列表
modes:
  - 1161
  - 1162
  - 1321
  - 1322
  - 1642
  - 1644
  - 2282
  - 1070

# 需要走 persistent 分支的 MODE 集合(列表形式,脚本内部会转换为 set)
persistent_modes:
  - 1161
  - 1162
  - 1321
  - 1322
  - 1642

# 各 MODE 对应的 PERSISTENT_MULTIPLIER 默认值
mode_default_mult:
  1161: 2
  1162: 2
  1321: 2
  1322: 2
  1642: 2

# Values swept for each persistent mode; ordinary-grid modes run once.
multipliers: [1, 2, 3, 4, 8, 12, 16, 32]

# =======================================================
# 矩阵/形状扫描配置
# =======================================================

# 描述要扫描哪些 (E, N, K, expected_m) case 的 YAML 文件
cases: masked_cases.yml

# =======================================================
# 运行相关参数
# =======================================================

# 监控 / 计算所用的 HCU 编号
gpu: 2

# 每个 expert 分配的最大 M 维(激活行数上限,需 >= EXPECTED 里的最大值)
m: 2048

# 基准测试节奏
warmup: 8
iters: 20
repeats: 3

# 原始测量结果 CSV 输出路径(相对本 yml 目录 or 绝对路径)
out: w4a8_masked_multiplier_sweep.csv

# 是否根据已存在的 CSV 断点续跑
resume: false

# 跑完 tuning 后是否顺便根据 CSV 产出 JSON 配置
emit_config: True

# 是否只根据现有 CSV 产出 JSON,不再跑 kernel
emit_only: false
# emit_only: True

# 是否只执行 emit_aggregate_configs 聚合逻辑
#   - 读取 {config_root}/{arch}/w4a8_masked_hipc/{layout} 下已有的 *_E*_N*_K*.json,
#     按众数汇总出 *_N*_K*.json 与 *_DEFAULT*.json, 不解析 CSV、不跑 kernel
#   - 为 True 时优先级高于 emit_only
aggregate_only: false

# 架构号: 留空 / null 则自动识别(同 w4a8_masked_hipc.py 的 _current_gfx_arch)
#   - 环境变量 DEEPGEMM_W4A8_MASKED_HIPC_ARCH 优先
#   - 也可显式指定: gfx936 / gfx938 / gfx92a
arch: null

# JSON 配置输出的布局子目录(可选)
#   - 留空: 直接输出到 {config_root}/{arch}/w4a8_masked_hipc/
#   - 填写: 输出到 {config_root}/{arch}/w4a8_masked_hipc/{layout}/
layout: ""

# JSON 配置输出根目录
#   - 留空 / null: 默认为本 yml 同目录(即输出到脚本同目录)
#   - 绝对路径:直接使用
#   - 相对路径:相对于本 yml 所在目录
# 若想覆盖 deepgemm 源码树里的 configs,可填:
#   config_root: ../../deepgemm/configs
# config_root: null
config_root: ../../deepgemm/configs
